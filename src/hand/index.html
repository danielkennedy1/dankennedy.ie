<!DOCTYPE html>
<html lang="en">
    <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hand — Daniel Kennedy</title>
  <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16x16.png">
  <link rel="manifest" href="/site.webmanifest">
  <link href="/style.css" rel="stylesheet">
  <style>
    body {
      overflow: auto;
    }
    .back-btn {
      position: fixed;
      top: 1.5rem;
      left: 1.5rem;
      z-index: 100;
      font-family: system-ui, sans-serif;
      font-weight: 600;
      font-size: clamp(1.25rem, 2.5vw, 1.75rem);
      color: white;
      padding: 1rem 1.5rem;
    }
    .back-btn:hover {
      color: black;
    }
    @media (max-width: 768px) {
      .back-btn {
        top: 1rem;
        left: 1rem;
      }
    }
    #hand-canvas-container {
      width: 100%;
      height: 100vh;
      position: relative;
      overflow: hidden;
    }
    #hand-canvas-container canvas {
      display: block;
      position: absolute;
      top: 0;
      left: 0;
    }
    #fetch-error {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #ff6666;
      font-family: system-ui, sans-serif;
      font-size: 1rem;
      text-align: center;
      padding: 2rem;
      max-width: 420px;
    }
    .content {
      padding: 4rem 2rem 6rem;
      max-width: 800px;
      margin: 0 auto;
    }
    .content h1 {
      font-family: system-ui, sans-serif;
      font-weight: 700;
      font-size: clamp(2rem, 5vw, 3.5rem);
      color: white;
      margin-bottom: 1.5rem;
      letter-spacing: -0.02em;
    }
    .content p {
      font-family: system-ui, sans-serif;
      font-size: 1rem;
      line-height: 1.7;
      color: rgba(255, 255, 255, 0.6);
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <a href="/" class="card back-btn">Go back</a>

  <div id="hand-canvas-container">
    <p id="fetch-error"></p>
  </div>

  <div class="content">
    <h1>Robotic Hand</h1>
    <p>
      The DG-5F is a 5-fingered dexterous robotic hand made by Tesollo.
    </p>
  </div>

  <script type="module" src="./hand.js"></script>
</body>
</html>
