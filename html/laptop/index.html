<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laptop — Daniel Kennedy</title>
  <link rel="apple-touch-icon" sizes="180x180" href="../images/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="../images/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="../images/favicon-16x16.png">
  <link rel="manifest" href="../site.webmanifest">
  <link href="../style.css" rel="stylesheet">
  <style>
    body {
      background: #000;
      margin: 0;
      overflow: auto;
    }
    .content {
      padding: 4rem 2rem 6rem;
      max-width: 800px;
      margin: 0 auto;
    }
    .content h1 {
      font-family: system-ui, sans-serif;
      font-weight: 700;
      font-size: clamp(2rem, 5vw, 3.5rem);
      color: white;
      margin-bottom: 1.5rem;
      letter-spacing: -0.02em;
    }
    .content p {
      font-family: system-ui, sans-serif;
      font-size: 1rem;
      line-height: 1.7;
      color: rgba(255, 255, 255, 0.6);
      margin-bottom: 1rem;
    }
    .back-btn {
      position: fixed;
      top: 1.5rem;
      left: 1.5rem;
      z-index: 100;
      font-family: system-ui, sans-serif;
      font-weight: 600;
      font-size: clamp(1.25rem, 2.5vw, 1.75rem);
      color: white;
      padding: 1rem 1.5rem;
    }
    .back-btn:hover {
      color: black;
    }
    @media (max-width: 768px) {
      .back-btn {
        top: 1rem;
        left: 1rem;
      }
    }
    #canvas-container {
      width: 100%;
      height: 100vh;
      position: relative;
      overflow: hidden;
    }
    #canvas-container canvas {
      display: block;
      position: absolute;
      top: 0;
      left: 0;
    }
    #fetch-error {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #ff6666;
      font-family: system-ui, sans-serif;
      font-size: 1rem;
      text-align: center;
      padding: 2rem;
      max-width: 420px;
    }
  </style>
</head>
<body>
  <a href="../" class="card back-btn">Go back</a>

  <div id="canvas-container">
    <p id="fetch-error"></p>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/SVGLoader.js"></script>
  <script>
    async function loadSVGAsWireframe(url, targetSize, depth, material) {
      const response = await fetch(url);
      if (!response.ok) throw new Error(`HTTP ${response.status} loading ${url}`);
      const svgText = await response.text();

      const loader = new THREE.SVGLoader();
      const svgData = loader.parse(svgText);

      const group = new THREE.Group();

      for (const shapePath of svgData.paths) {
        const shapes = THREE.SVGLoader.createShapes(shapePath);
        for (const shape of shapes) {
          const extrudeGeo = new THREE.ExtrudeGeometry(shape, {
            depth: depth,
            bevelEnabled: false,
            curveSegments: 1,
          });
          const edgesGeo = new THREE.EdgesGeometry(extrudeGeo);
          group.add(new THREE.LineSegments(edgesGeo, material));
          extrudeGeo.dispose();
        }
      }

      // Flip SVG Y-down to Three.js Y-up
      group.scale.y = -1;

      // Normalize: scale so max(width, height) = targetSize
      const bbox = new THREE.Box3().setFromObject(group);
      const size = new THREE.Vector3();
      bbox.getSize(size);
      const maxDim = Math.max(size.x, size.y);
      const scaleFactor = targetSize / maxDim;
      group.scale.multiplyScalar(scaleFactor);

      group.scale.z = depth;

      // Center at origin
      bbox.setFromObject(group);
      const center = new THREE.Vector3();
      bbox.getCenter(center);
      group.position.sub(center);

      return group;
    }

    async function init() {
      const container = document.getElementById('canvas-container');
      const scene = new THREE.Scene();

      const width = container.clientWidth;
      const height = container.clientHeight;
      const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);

      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setClearColor(0x000000, 0);
      renderer.setSize(width, height);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      container.appendChild(renderer.domElement);

      const lineMat = new THREE.LineBasicMaterial({ color: 0xffffff });
      const TARGET_SIZE = 5;
      const EXTRUDE_DEPTH = 1;

      let hyprlandGroup, nixosGroup;
      try {
        [hyprlandGroup, nixosGroup] = await Promise.all([
          loadSVGAsWireframe('./Hyprland_Logo_Icon.svg', TARGET_SIZE, EXTRUDE_DEPTH, lineMat),
          loadSVGAsWireframe('./nixos-logo-default-gradient-black-regular-horizontal-recommended.svg', TARGET_SIZE, EXTRUDE_DEPTH, lineMat),
        ]);
      } catch (err) {
        console.error(err);
        const el = document.getElementById('fetch-error');
        el.style.display = 'block';
        el.textContent = 'Could not load SVG files. This page must be served over HTTP — fetch of local files is blocked under file://.';
        return;
      }

      hyprlandGroup.position.x = -4;
      nixosGroup.position.x = 4;

      scene.add(hyprlandGroup);
      scene.add(nixosGroup);

      // Spherical orbit state
      let theta = Math.PI/8;
      let phi = Math.PI/2;
      let radius = 15;

      function updateCamera() {
        camera.position.set(
          radius * Math.sin(phi) * Math.sin(theta),
          radius * Math.cos(phi),
          radius * Math.sin(phi) * Math.cos(theta)
        );
        camera.lookAt(0, 0, 0);
      }
      updateCamera();

      // Mouse / touch drag orbit
      let isDragging = false;
      let lastX = 0;
      let lastY = 0;

      renderer.domElement.addEventListener('pointerdown', e => {
        isDragging = true;
        lastX = e.clientX;
        lastY = e.clientY;
        renderer.domElement.setPointerCapture(e.pointerId);
      });

      renderer.domElement.addEventListener('pointermove', e => {
        if (!isDragging) return;
        const dx = e.clientX - lastX;
        const dy = e.clientY - lastY;
        theta -= dx * 0.005;
        phi = Math.max(0.05, Math.min(Math.PI - 0.05, phi + dy * 0.005));
        lastX = e.clientX;
        lastY = e.clientY;
        updateCamera();
      });

      renderer.domElement.addEventListener('pointerup', () => {
        isDragging = false;
      });

      // Scroll to zoom
      renderer.domElement.addEventListener('wheel', e => {
        radius = Math.max(12, Math.min(120, radius + e.deltaY * 0.05));
        updateCamera();
      }, { passive: true });

      // Resize
      window.addEventListener('resize', () => {
        const w = container.clientWidth;
        const h = container.clientHeight;
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        renderer.setSize(w, h);
      });

      // Render loop — auto-rotate azimuth when not dragging
      const AUTO_SPEED = 0.001;
      function animate() {
        requestAnimationFrame(animate);
        if (!isDragging) {
          //theta += AUTO_SPEED;
          updateCamera();
        }
        renderer.render(scene, camera);
      }
      animate();
    }

    init();
  </script>

  <div class="content">
    <h1>You learn something new every day</h1>
    <p>
        Whether you want to or not.
    </p>
  </div>

</body>
</html>
